[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muzdaw"
version = "0.1.0"
description = "FL Studio style music maker for Linux: window and commands, DawDreamer render, pedalboard effects."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "dawdreamer>=0.9.0",
    "pedalboard>=0.9.26",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "sounddevice>=0.4",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]
ui = ["PySide6>=6.8"]

[project.scripts]
muzdaw = "muzdaw.cli:main"

[project.gui-scripts]
muzdaw-ui = "muzdaw.ui.app:main"

[tool.setuptools]
packages = ["muzdaw", "muzdaw.ui"]

[tool.setuptools.package-data]
"muzdaw.ui" = ["help.md", "icon.svg"]
